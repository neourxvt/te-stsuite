# Minimum payload size for each workload sample, in bytes.
min_bytes = 1048576
# Number of unmeasured passes for each workload before measuring.
warmup = 1
# Maximum time to measure each workload, in seconds.
max_seconds = 10
# Maximum samples per workload and startup run; 0 means no sample limit.
max_samples = 0
# Minimum total startup time to measure, in seconds.
startup_min_seconds = 3
# Minimum number of terminal launches to measure for startup.
startup_min_samples = 10
# Maximum time allowed for each terminal launch to start its worker.
startup_timeout_seconds = 30
# Resource accounting: "cgroupv2" or "polling".
monitor = "cgroupv2"
# CPU placement: "cgroupv2" or "taskset".
process_isolation = "taskset"

# Typometer measures up to this many injected period characters per run.
typometer_count = 100
# Wait after each character, or type independently of rendering when true.
typometer_delay_ms = 0
typometer_asynchronous = false
# Replace the normal delay every N characters; 0 disables periodic pauses.
typometer_pause_every = 0
typometer_pause_ms = 1000

# Each named table configures a terminal. Its cmd must include {CMD} as a
# standalone word; pass inline configs through {CFG} or an env reference below.
# Use a minimal monospace font configuration at size 11 for each terminal.
# Kitty also offers a profile with latency settings for comparison.
[alacritty]
cmd = "alacritty --config-file {CFG} -e {CMD}"

[alacritty.configs]
standard = """
[font]
normal = { family = "monospace" }
size = 11.0
"""

[kitty]
cmd = "kitty --config {CFG} {CMD}"

# Each key names a variant; its string is written to a temporary config file.
# The terminal command uses {CFG} in place of that file's path.
[kitty.configs]
defaults = """
font_family monospace
font_size 11.0
"""

minlatency = """
font_family monospace
font_size 11.0
# Minimize latency
input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no
"""

[nrxvt]
cmd = "nrxvt -e {CMD}"

# X resource clients receive their font settings through XENVIRONMENT.
[nrxvt.xresources]
"nrxvt*font" = "xft:monospace:size=11"

[urxvt]
cmd = "/usr/bin/urxvt -e {CMD}"

[urxvt.xresources]
"URxvt*font" = "xft:monospace:size=11"

[xterm]
cmd = "xterm -e {CMD}"

# Optional X resources are written to a temporary file for this terminal run.
[xterm.xresources]
"xterm*faceName" = "monospace"
"xterm*faceSize" = 11

[ghostty]
# Ghostty requires --config-file=PATH, so join the standalone {CFG} in a shell.
cmd = '''sh -c 'ghostty_config=$1; shift; exec ghostty --config-default-files=false --config-file="$ghostty_config" -e "$@"' sh {CFG} {CMD}'''

[ghostty.configs]
standard = """
font-family = monospace
font-size = 11
"""

[rio]
cmd = "rio -e {CMD}"

# Rio reads config.toml from the temporary config directory.
[rio.env]
RIO_CONFIG_HOME = "{CFG_DIR}"

[rio.configs]
standard = """
[fonts]
family = "monospace"
size = 11.0
"""

[contour]
cmd = "contour terminal config {CFG} profile standard {CMD}"

[contour.configs]
standard = """
profiles:
  standard:
    font:
      size: 11
      regular:
        family: monospace
"""
