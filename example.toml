# Minimum payload size for each workload sample, in bytes.
min_bytes = 1048576
# Number of unmeasured passes for each workload before measuring.
warmup = 0
# Maximum time to measure each workload, in seconds.
max_seconds = 10
# Maximum samples per workload and startup run; 0 means no sample limit.
max_samples = 0
# Minimum total startup time to measure, in seconds.
startup_min_seconds = 3
# Minimum number of terminal launches to measure for startup.
startup_min_samples = 10
# Maximum time allowed for each terminal launch to start its worker.
startup_timeout_seconds = 30
# Resource accounting: "cgroupv2" or "polling".
monitor = "cgroupv2"
# CPU placement: "cgroupv2" or "taskset".
process_isolation = "taskset"

[typometer.synthetic]
# Typometer measures up to this many injected period characters per run.
count = 100
# Wait after each character, or type independently of rendering when true.
delay_ms = 0
asynchronous = false
# Replace the normal delay every N characters; 0 disables periodic pauses.
pause_every = 0
pause_ms = 1000

[typometer.typing]
count = 100
delay_ms = 40
asynchronous = true
pause_every = 0
pause_ms = 1000

[variables]
# Base16 Default Dark colors. Use {NAME} to substitute values in strings below.
FONT_FAMILY = "DejaVu Sans Mono"
# Font size in points; terminals with pixel-based sizing need conversion.
FONT_SIZE = "11"
# Zutty uses a filename prefix and integer pixels: 15 px is about 11 pt at 96 DPI.
FONT_FILE_PREFIX = "DejaVuSansMono"
FONT_SIZE_PX = "15"
BASE00 = "#000000"
BASE01 = "#282828"
BASE02 = "#383838"
BASE03 = "#585858"
BASE04 = "#b8b8b8"
BASE05 = "#ffffff"
BASE06 = "#e8e8e8"
BASE07 = "#f8f8f8"
BASE08 = "#ab4642"
BASE09 = "#dc9656"
BASE0A = "#f7ca88"
BASE0B = "#a1b56c"
BASE0C = "#86c1b9"
BASE0D = "#7cafc2"
BASE0E = "#ba8baf"
BASE0F = "#a16946"

# Each named table configures a terminal. Its cmd must include {CMD} as a
# standalone word; pass inline configs through {CFG} or an env reference below.
# Terminal configs share FONT_FAMILY and FONT_SIZE from [variables].
# Kitty also offers a profile with latency settings for comparison.
[alacritty]
cmd = "alacritty --config-file {CFG} -e {CMD}"
version = { cmd = "alacritty --version" }

[alacritty.configs]
standard = """
[font]
normal = { family = "{FONT_FAMILY}" }
size = {FONT_SIZE}

# Use the shared Base16 palette, matching the other terminal configs.
[colors]
indexed_colors = [
  { index = 16, color = "{BASE09}" },
  { index = 17, color = "{BASE0F}" },
  { index = 18, color = "{BASE01}" },
  { index = 19, color = "{BASE02}" },
  { index = 20, color = "{BASE04}" },
  { index = 21, color = "{BASE06}" },
]
[colors.primary]
foreground = "{BASE05}"
background = "{BASE00}"
[colors.cursor]
cursor = "{BASE05}"
text = "{BASE00}"
[colors.selection]
text = "{BASE05}"
background = "{BASE02}"
[colors.normal]
black = "{BASE00}"
red = "{BASE08}"
green = "{BASE0B}"
yellow = "{BASE0A}"
blue = "{BASE0D}"
magenta = "{BASE0E}"
cyan = "{BASE0C}"
white = "{BASE05}"
[colors.bright]
black = "{BASE03}"
red = "{BASE08}"
green = "{BASE0B}"
yellow = "{BASE0A}"
blue = "{BASE0D}"
magenta = "{BASE0E}"
cyan = "{BASE0C}"
white = "{BASE07}"
"""

[kitty]
cmd = "kitty --config {CFG} {CMD}"
version = { cmd = "kitty --version" }

# Each key names a variant; its string is written to a temporary config file.
# The terminal command uses {CFG} in place of that file's path.
[kitty.configs]
defaults = """
font_family {FONT_FAMILY}
font_size {FONT_SIZE}
foreground {BASE05}
