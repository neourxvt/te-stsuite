cmd = "ghostty --config-default-files=false --config-file={CFG} -e {CMD}"
version = { cmd = "ghostty --version", head = 1 }
silence_output = true

[ghostty.configs]
standard = """
font-family = "{FONT_FAMILY}"
font-size = {FONT_SIZE}
"""

[rio]
cmd = "rio -e {CMD}"
version = { cmd = "rio --version" }

# Rio reads config.toml from the temporary config directory.
[rio.env]
RIO_CONFIG_HOME = "{CFG_DIR}"

[rio.configs]
standard = """
[fonts]
family = "{FONT_FAMILY}"
size = {FONT_SIZE}
"""

[zutty]
cmd = "zutty -font '{FONT_FILE_PREFIX}' -fontsize {FONT_SIZE_PX} -e {CMD}"

[konsole]
cmd = "konsole --separate --profile benchmark -e {CMD}"
[konsole.env]
# Isolate the named scheme from the user's installed colorschemes.
XDG_DATA_HOME = "{CFG_DIR}"

# Konsole resolves named schemes from the konsole/ data subdirectory.
[konsole.configs.default.files]
"konsole/benchmark.profile" = """
[General]
Name=benchmark
[Appearance]
# QFont serialization starts with the family, point size and pixel-size override.
Font={FONT_FAMILY},{FONT_SIZE},-1,5,50,0,0,0,0,0
ColorScheme=benchmark
"""
