[ghostty]
# Keep Ghostty's user config from changing the benchmark's terminal setup.
cmd = "ghostty --config-default-files=false --config-file={CFG} -e {CMD}"
version = { cmd = "ghostty --version", head = 1 }

[ghostty.configs]
standard = """
font-family = "{FONT_FAMILY}"
font-size = {FONT_SIZE}
"""

[rio]
cmd = "rio -e {CMD}"
version = { cmd = "rio --version" }

# Rio reads config.toml from the temporary config directory.
[rio.env]
RIO_CONFIG_HOME = "{CFG_DIR}"

[rio.configs]
standard = """
[fonts]
family = "{FONT_FAMILY}"
size = {FONT_SIZE}.0
"""

