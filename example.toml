min_bytes = 1048576
warmup = 1
max_seconds = 10
max_samples = 0
startup_min_seconds = 3
startup_min_samples = 10
startup_timeout_seconds = 30
monitor = "cgroupv2"

[alacritty]
cmd = "alacritty -e {CMD}"

[kitty]
cmd = "kitty --config {CFG} {CMD}"

[kitty.configs]
compact = """
font_size 11.0
"""

[nrxvt]
cmd = "nrxvt -e {CMD}"

[urxvt]
cmd = "/usr/bin/urxvt -e {CMD}"

[xterm]
cmd = "xterm -e {CMD}"

[ghostty]
cmd = "ghostty -e {CMD}"

[rio]
cmd = "rio -e {CMD}"

[contour]
cmd = "contour terminal {CMD}"
