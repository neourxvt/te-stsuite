normal = { family = "{FONT_FAMILY}" }
size = {FONT_SIZE}
# Use the shared Base16 palette, matching the other terminal configs.
[colors]
indexed_colors = [
  { index = 16, color = "{BASE09}" },
  { index = 17, color = "{BASE0F}" },
  { index = 18, color = "{BASE01}" },
  { index = 19, color = "{BASE02}" },
  { index = 20, color = "{BASE04}" },
  { index = 21, color = "{BASE06}" },
]
[colors.primary]
foreground = "{BASE05}"
background = "{BASE00}"
[colors.cursor]
cursor = "{BASE05}"
text = "{BASE00}"
[colors.selection]
text = "{BASE05}"
background = "{BASE02}"
[colors.normal]
black = "{BASE00}"
red = "{BASE08}"
green = "{BASE0B}"
yellow = "{BASE0A}"
blue = "{BASE0D}"
magenta = "{BASE0E}"
cyan = "{BASE0C}"
